<video id="cameraVideo" class="camera-source" playsinline muted aria-hidden="true"></video>

<button
  class="debug-panel-button"
  id="debugPanelButton"
  type="button"
  aria-controls="debugPanel"
  aria-expanded="true"
  aria-label="デバッグ表示を閉じる"
  title="デバッグ表示を開閉"
>…</button>

<aside class="debug-panel" id="debugPanel" aria-label="デバッグ表示">
  <div class="panel-header" id="debugPanelHeader">
    <span>デバッグ表示</span>
    <span id="fpsText">処理 0 fps</span>
  </div>
  <div class="debug-controls" aria-label="デバッグ操作">
    <button class="icon-button" id="cameraToggle" type="button">カメラ開始</button>
    <button class="icon-button" id="pdfLoad" type="button">資料読込</button>
    <button class="icon-button" id="fullscreenButton" type="button">全画面</button>
    <input
      id="pdfFileInput"
      type="file"
      accept="application/pdf,.pdf,application/vnd.ms-powerpoint,.ppt,application/vnd.openxmlformats-officedocument.presentationml.presentation,.pptx"
      hidden
    />
  </div>
  <div class="debug-status-list" aria-label="動作状態">
    <span class="status-pill ready" id="visionStatus">Vision: Pose Landmarker lite</span>
    <span class="status-pill" id="cameraStatus">Camera: 停止中</span>
    <span class="status-pill" id="engineStatus">Gesture: 待機中</span>
  </div>
  <canvas id="debugCanvas" width="640" height="480"></canvas>
  <dl class="debug-grid">
    <div><dt>追跡関節</dt><dd id="candidateText">none</dd></div>
    <div><dt>検出点</dt><dd id="areaText">0</dd></div>
    <div><dt>信頼度</dt><dd id="confidenceText">-</dd></div>
    <div><dt>最終確定</dt><dd id="lastGestureText">none</dd></div>
  </dl>
  <section class="snap-twist-status" aria-label="Snap Twist状態">
    <div class="snap-twist-title">Snap Twist</div>
    <div class="snap-twist-steps" id="snapTwistSteps">
      <span class="snap-step is-active" data-snap-twist-step="idle" aria-current="step">待機</span>
      <span class="snap-step" data-snap-twist-step="headLevel" aria-current="false">頭位置</span>
      <span class="snap-step" data-snap-twist-step="ready" aria-current="false">構え</span>
      <span class="snap-step" data-snap-twist-step="fired" aria-current="false">発火</span>
    </div>
  </section>
</aside>
