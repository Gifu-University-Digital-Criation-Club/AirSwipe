<main class="app-shell">
  <section class="slide-stage" aria-label="PowerPoint風スライド">
    <header class="topbar">
      <div>
        <p class="eyebrow">Gesture Slide Template</p>
        <h1>手の動きで方向を認識</h1>
      </div>
    </header>

    <div class="slide-content">
      <div class="direction-card" aria-live="polite">
        <p class="label">認識結果</p>
        <strong id="directionText">READY</strong>
        <span id="gestureMeta">矢印キーでも確認できます</span>
      </div>
      <div class="direction-pad" aria-hidden="true">
        <div></div>
        <div id="pad-up" class="pad-cell">UP</div>
        <div></div>
        <div id="pad-left" class="pad-cell">LEFT</div>
        <div id="pad-idle" class="pad-center active">IDLE</div>
        <div id="pad-right" class="pad-cell">RIGHT</div>
        <div></div>
        <div id="pad-down" class="pad-cell">DOWN</div>
        <div></div>
      </div>
    </div>

  </section>

</main>
