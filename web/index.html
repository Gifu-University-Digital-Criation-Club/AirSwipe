<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>縦スクロール・スライドビューア</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- スライド全体を囲むラッパー -->
    <div class="slide-wrapper">
        
        <!-- 1枚目のスライド -->
        <div class="slide-container">
            <!-- スライド操作をさせずスクロールに集中させるための透明なカバー -->
            <div class="slide-cover"></div>
            <!-- ★ご自身のGoogleスライドのURLに差し替えてください（末尾に #slide=id.p1） -->
             <iframe src="https://docs.google.com/presentation/d/1RTvRbBZs4hYSlCeWgCEG4qD8BFxKiE1I6KGnjiYkbK0/embed?start=false&loop=false&delayms=60000&slide=id.g3f756445394_0_0" frameborder="0" width="1440" height="839" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
        </div>

        <!-- 2枚目のスライド -->
        <div class="slide-container">
            <div class="slide-cover"></div>
            <!-- 末尾を #slide=id.p2 に変更 -->
            <iframe src="https://docs.google.com/presentation/d/1RTvRbBZs4hYSlCeWgCEG4qD8BFxKiE1I6KGnjiYkbK0/embed?start=false&loop=false&delayms=60000&slide=id.g3f756445394_0_75" frameborder="0" width="1440" height="839" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
        </div>

        <!-- 3枚目のスライド -->
        <div class="slide-container">
            <div class="slide-cover"></div>
            <!-- 末尾を #slide=id.p3 に変更 -->
           <iframe src="https://docs.google.com/presentation/d/1RTvRbBZs4hYSlCeWgCEG4qD8BFxKiE1I6KGnjiYkbK0/embed?start=false&loop=false&delayms=60000&slide=id.g3f756445394_0_81" frameborder="0" width="1440" height="839" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
        </div>

        <!-- 4枚目のスライド -->
        <div class="slide-container">
            <div class="slide-cover"></div>
            <!-- 末尾を #slide=id.p3 に変更 -->
           <iframe src="https://docs.google.com/presentation/d/1RTvRbBZs4hYSlCeWgCEG4qD8BFxKiE1I6KGnjiYkbK0/embed?start=false&loop=false&delayms=60000&slide=id.g3f756445394_0_88" frameborder="0" width="1440" height="839" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
        </div>

        <!-- 5枚目のスライド -->
        <div class="slide-container">
            <div class="slide-cover"></div>
            <!-- 末尾を #slide=id.p3 に変更 -->
           <iframe src="https://docs.google.com/presentation/d/1RTvRbBZs4hYSlCeWgCEG4qD8BFxKiE1I6KGnjiYkbK0/embed?start=false&loop=false&delayms=60000&slide=id.g3f756445394_0_95" frameborder="0" width="1440" height="839" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
