<!-- スライド全体を囲むラッパー -->
<main class="pdf-presentation">
  <p id="pdf-status" role="status">
    PDFを読み込んでいます…
  </p>

  <div
    id="pdf-viewer"
    class="slide-wrapper"
    aria-label="PDFスライド"
    aria-busy="true"
  ></div>
</main>

  <div class="slide-container">
    <!-- スライド操作をさせずスクロールに集中させるための透明なカバー -->
    <div class="slide-cover"></div>
    <!-- ★ご自身のGoogleスライドのURLに差し替えてください（末尾に #slide=id.p1） -->
      <iframe src="https://docs.google.com/presentation/d/1RTvRbBZs4hYSlCeWgCEG4qD8BFxKiE1I6KGnjiYkbK0/embed?start=false&loop=false&delayms=60000&slide=id.g3f756445394_0_0" frameborder="0" width="1440" height="839" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
  </div>
